<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>アルファベット・クエスト</title>
    <style>
        :root { 
            --primary: #3498db; --success: #2ecc71; --gold: #f1c40f; --miss: #e74c3c; --bg: #f8fbff; 
            
            /* 指使いカラー（左右の手を色分け） */
            --f-pinky-l: #ff5e57;   /* 左手小指：赤 */
            --f-ring-l: #f1c40f;    /* 左手薬指：黄色 */
            --f-middle-l: #2ecc71;  /* 左手中指：緑 */
            --f-index-l: #00d2d3;   /* 左手人差し指：水色 */
            --f-index-r: #3867d6;   /* 右手人差し指：青 */
            --f-middle-r: #20bf6b;  /* 右手中指：深緑 */
            --f-ring-r: #ff9f43;    /* 右手薬指：オレンジ */
            --f-pinky-r: #fd79a8;   /* 右手小指：ピンク */
        }
        
        /* スマホ用デフォルトリセット & タップ強調の無効化 */
        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
            -webkit-user-select: none;
        }

        body { 
            font-family: "Helvetica Neue", Arial, "Hiragino Kaku Gothic ProN", sans-serif; 
            background: var(--bg); 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            min-height: 100vh; 
            margin: 0; 
            padding: 10px 10px 30px 10px; 
            overflow-x: hidden;
            touch-action: manipulation; /* ダブルタップズーム防止 */
        }
        
        .overlay { 
            position: fixed; 
            top: 0; 
            left: 0; 
            width: 100%; 
            height: 100%; 
            background: rgba(255,255,255,0.98); 
            display: flex; 
            flex-direction: column; 
            justify-content: center; 
            align-items: center; 
            z-index: 1000; 
            text-align: center; 
            padding: 20px;
            overflow-y: auto;
        }
        .main-title { font-size: 36px; color: var(--primary); font-weight: bold; margin-bottom: 5px; }
        .sub-title { color: #7f8c8d; margin-bottom: 12px; font-size: 16px; font-weight: bold; }
        
        /* 設定セレクター共通 */
        .setting-selector { 
            background: #f0f0f0; padding: 5px; border-radius: 40px; display: inline-flex; gap: 5px; margin-bottom: 25px; border: 2px solid #ddd;
        }
        .setting-btn {
            padding: 10px 18px; border-radius: 30px; border: none; cursor: pointer; font-weight: bold; background: transparent; color: #888; transition: 0.3s; font-size: 14px;
        }
        .setting-btn.active { background: white; color: var(--primary); box-shadow: 0 4px 10px rgba(0,0,0,0.1); }

        /* コレクションマップ */
        .collection-container { 
            margin-top: 5px; padding: 12px; background: #d1d8e0; border-radius: 20px; 
            width: 100%; max-width: 600px; box-shadow: inset 0 2px 8px rgba(0,0,0,0.1); 
            text-align: center; transition: all 0.3s ease;
        }
        /* 非表示時のコンテナスタイル */
        .collection-container.map-hidden { padding: 8px 15px; background: #e2e8f0; }
        .collection-container.map-hidden .collection-grid { display: none; }

        .collection-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; padding: 0 5px; }
        .collection-container.map-hidden .collection-header { margin-bottom: 0; }

        .layout-switch-btn { padding: 6px 12px; font-size: 11px; background: white; border: 1px solid #ccc; border-radius: 20px; cursor: pointer; font-weight: bold; color: #666; margin-left: 2px; }
        .layout-switch-btn.active { background: var(--primary); color: white; border-color: var(--primary); }

        .collection-grid { display: flex; flex-direction: column; align-items: center; gap: 4px; }
        .kbd-row { display: flex; gap: 3px; justify-content: center; width: 100%; }

        .char-slot { 
            width: 25px; height: 32px; background: white; border: 2px solid #ccc; border-radius: 5px;
            display: flex; justify-content: center; align-items: center;
            font-weight: bold; color: #bbb; font-size: 12px; transition: all 0.2s;
        }
        
        /* 指別の枠線（画像に基づいた配色） */
        .border-pinky-l  { border-color: var(--f-pinky-l); }
        .border-ring-l   { border-color: var(--f-ring-l); }
        .border-middle-l { border-color: var(--f-middle-l); }
        .border-index-l  { border-color: var(--f-index-l); }
        .border-index-r  { border-color: var(--f-index-r); }
        .border-middle-r { border-color: var(--f-middle-r); }
        .border-ring-r   { border-color: var(--f-ring-r); }
        .border-pinky-r  { border-color: var(--f-pinky-r); }

        /* クリア状態（母音は担当指のカラーで塗りつぶし） */
        .char-slot.active { color: white; border-width: 2px; }
        .char-slot.active:not([class*="fill-"]) { background: var(--gold); border-color: #f39c12; }
        .char-slot.active.fill-a { background: var(--f-pinky-l) !important; border-color: var(--f-pinky-l); }
        .char-slot.active.fill-e { background: var(--f-middle-l) !important; border-color: var(--f-middle-l); }
        .char-slot.active.fill-u { background: var(--f-index-r) !important; border-color: var(--f-index-r); }
        .char-slot.active.fill-i { background: var(--f-middle-r) !important; border-color: var(--f-middle-r); }
        .char-slot.active.fill-o { background: var(--f-ring-r) !important; border-color: var(--f-ring-r); }

        /* ゲーム操作部 */
        .question-area { margin: 15px 0; text-align: center; min-height: 130px; display: flex; flex-direction: column; align-items: center; justify-content: center; }
        .speaker-btn { 
            width: 85px; height: 85px; border-radius: 50%; background: var(--primary); 
            border: none; cursor: pointer; display: inline-flex; align-items: center; justify-content: center;
            box-shadow: 0 6px 0 #2980b9; transition: 0.1s; margin-bottom: 8px;
        }
        .speaker-btn:active { transform: translateY(4px); box-shadow: 0 2px 0 #2980b9; }
        .speaker-icon { font-size: 40px; color: white; margin-left: 2px; }

        #reading-display { 
            font-size: 24px; font-weight: bold; color: #555; height: 38px; 
            margin-top: 3px; background: #fff; padding: 4px 20px; border-radius: 30px;
            display: inline-block; min-width: 120px; border: 2px solid #eee;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
        }

        /* 4択グリッド */
        .choices-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; width: 100%; max-width: 420px; padding: 0 5px; }
        .choice-card { 
            background: white; border: 3px solid #eee; border-radius: 16px; padding: 22px 0;
            font-size: 34px; font-weight: bold; color: #444; cursor: pointer; transition: 0.15s;
            text-align: center; box-shadow: 0 4px 8px rgba(0,0,0,0.05);
        }
        /* モバイルでのタップ感(アクティブ状態) */
        .choice-card:active { transform: scale(0.95); border-color: var(--primary); }
        .choice-card.correct { background: var(--success); color: white; border-color: var(--success); animation: pop 0.3s forwards; }
        .choice-card.wrong { background: var(--miss); color: white; border-color: var(--miss); }

        @keyframes pop { 50% { transform: scale(1.08); } }
        
        .btn { 
            padding: 16px 45px; font-size: 20px; cursor: pointer; border-radius: 50px; border: none; 
            background: var(--primary); color: white; font-weight: bold; 
            box-shadow: 0 5px 15px rgba(52, 152, 219, 0.4); transition: 0.2s;
        }
        .btn:active { transform: scale(0.96); background: #2980b9; }
        
        #status-msg { font-size: 18px; font-weight: bold; color: #7f8c8d; margin-top: 12px; height: 24px; text-align: center; }

        /* リザルト画面・分析パーツ */
        .result-card {
            background: white;
            padding: 20px;
            border-radius: 24px;
            border: 2px solid #e1e8ed;
            width: 100%;
            max-width: 450px;
            margin: 15px 0;
            box-shadow: 0 10px 25px rgba(0,0,0,0.05);
        }
        .chart-section {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin: 15px 0;
        }
        /* CSSドーナツ円グラフ */
        .donut-chart {
            width: 140px;
            height: 140px;
            border-radius: 50%;
            background: conic-gradient(var(--success) 0% 0%, #ffeaa7 0% 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            box-shadow: inset 0 2px 5px rgba(0,0,0,0.05), 0 4px 10px rgba(0,0,0,0.08);
            margin-bottom: 15px;
        }
        .donut-chart::before {
            content: "";
            position: absolute;
            width: 95px;
            height: 95px;
            background: white;
            border-radius: 50%;
        }
        .donut-center-text {
            position: absolute;
            font-size: 26px;
            font-weight: bold;
            color: #2c3e50;
            text-align: center;
            line-height: 1.1;
        }
        .donut-center-text span {
            font-size: 11px;
            color: #7f8c8d;
            display: block;
            margin-top: 2px;
        }
        .legend-container {
            width: 100%;
            display: flex;
            justify-content: space-around;
            font-size: 13px;
            font-weight: bold;
            color: #555;
            border-top: 1px dashed #eee;
            padding-top: 10px;
        }
        .legend-item {
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .legend-color {
            width: 14px;
            height: 14px;
            border-radius: 4px;
        }
        .legend-color.ok { background-color: var(--success); }
        .legend-color.retry { background-color: #ffeaa7; }

        /* にがてなもじ（えらびなおしたもじ）エリア */
        .weak-letters-container {
            margin-top: 15px;
            text-align: center;
            width: 100%;
        }
        .weak-title {
            font-size: 14px;
            font-weight: bold;
            color: #7f8c8d;
            margin-bottom: 8px;
        }
        .weak-grid {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            justify-content: center;
        }
        .weak-slot {
            width: 32px;
            height: 40px;
            background: #fff;
            border: 2px solid #ccc;
            border-radius: 6px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            font-weight: bold;
            color: #333;
            font-size: 14px;
            position: relative;
        }
        .weak-badge {
            position: absolute;
            top: -6px;
            right: -6px;
            background: var(--miss);
            color: white;
            font-size: 9px;
            border-radius: 10px;
            padding: 1px 4px;
            font-weight: bold;
        }
        .perfect-badge {
            font-size: 40px;
            margin: 10px 0;
            animation: bounce 1s infinite alternate;
        }
        @keyframes bounce {
            from { transform: translateY(0); }
            to { transform: translateY(-8px); }
        }

        /* スマホ縦画面での微調整 (メディアクエリ) */
        @media (max-width: 480px) {
            .main-title { font-size: 30px; }
            .sub-title { font-size: 14px; margin-bottom: 8px; }
            .setting-selector { margin-bottom: 20px; padding: 4px; }
            .setting-btn { padding: 8px 14px; font-size: 12px; }
            
            .char-slot { 
                width: calc((100vw - 60px) / 13); /* 画面幅に合わせて自動縮小 */
                max-width: 26px; 
                height: 32px; 
                font-size: 11px; 
                border-width: 1.5px;
            }
            .collection-container { padding: 8px; border-radius: 15px; }
            .layout-switch-btn { padding: 4px 8px; font-size: 10px; }
            
            .question-area { min-height: 110px; margin: 10px 0; }
            .speaker-btn { width: 70px; height: 70px; margin-bottom: 5px; }
            .speaker-icon { font-size: 32px; }
            #reading-display { font-size: 20px; height: 32px; padding: 2px 15px; min-width: 100px; }
            
            .choices-grid { gap: 10px; }
            .choice-card { padding: 16px 0; font-size: 30px; border-radius: 12px; border-width: 2px; }
            #status-msg { font-size: 16px; margin-top: 8px; }
            
            .result-card { padding: 15px; }
            .donut-chart { width: 120px; height: 120px; }
            .donut-chart::before { width: 80px; height: 80px; }
            .donut-center-text { font-size: 22px; }
        }
    </style>
</head>
<body>

    <div id="start-screen" class="overlay">
        <div class="main-title">アルファベット A-Z</div>
        
        <div class="sub-title">🔊 こえの しゅるい</div>
        <div class="setting-selector">
            <button id="mode-kana" class="setting-btn active" onclick="setVoiceMode('kana')">ひらがな (にほんご)</button>
            <button id="mode-native" class="setting-btn" onclick="setVoiceMode('native')">Native (えいご)</button>
        </div>

        <div class="sub-title">📝 もんだいの かず</div>
        <div class="setting-selector">
            <button id="q-5" class="setting-btn" onclick="setQuestionCount(5)">5もん</button>
            <button id="q-10" class="setting-btn" onclick="setQuestionCount(10)">10もん</button>
            <button id="q-all" class="setting-btn active" onclick="setQuestionCount(26)">ぜんぶ (26もん)</button>
        </div>

        <div style="margin-top: 10px;">
            <button class="btn" onclick="initGame()">スタート！</button>
        </div>
    </div>

    <!-- 進捗マップセクション -->
    <div class="collection-container" id="collectionContainer">
        <div class="collection-header">
            <div style="font-size: 11px; color: #666; font-weight: bold; letter-spacing: 0.5px;">こたえたアルファベット</div>
            <div>
                <button id="layoutHideBtn" class="layout-switch-btn" onclick="switchMapLayout('hide')">非表示</button>
                <button id="layoutAbcBtn" class="layout-switch-btn active" onclick="switchMapLayout('abc')">ABC順</button>
                <button id="layoutKbdBtn" class="layout-switch-btn" onclick="switchMapLayout('keyboard')">キーボード</button>
            </div>
        </div>
        <div class="collection-grid" id="collectionGrid"></div>
    </div>

    <div class="question-area">
        <button class="speaker-btn" id="speakerBtn" onclick="playCurrentTarget()">
            <span class="speaker-icon">▶</span>
        </button>
        <br>
        <div id="reading-display">？</div>
    </div>

    <div class="choices-grid" id="choicesGrid"></div>
    <div id="status-msg"></div>

    <div id="result-screen" class="overlay" style="display:none;">
        <div id="result-content" style="width: 100%; display: flex; flex-direction: column; align-items: center;"></div>
        <button class="btn" onclick="location.reload()">もういちど あそぶ</button>
    </div>

    <script>
        const charData = {
            'A': { read: 'えー', finger: 'pinky-l', fill: 'fill-a' },
            'B': { read: 'びー', finger: 'index-l' },
            'C': { read: 'しー', finger: 'middle-l' },
            'D': { read: 'でー', finger: 'middle-l' },
            'E': { read: 'いー', finger: 'middle-l', fill: 'fill-e' },
            'F': { read: 'えふ', finger: 'index-l' },
            'G': { read: 'じー', finger: 'index-l' },
            'H': { read: 'えいち', finger: 'index-r' },
            'I': { read: 'あい', finger: 'middle-r', fill: 'fill-i' },
            'J': { read: 'じぇー', finger: 'index-r' },
            'K': { read: 'けー', finger: 'middle-r' },
            'L': { read: 'える', finger: 'ring-r' },
            'M': { read: 'えむ', finger: 'index-r' },
            'N': { read: 'えぬ', finger: 'index-r' },
            'O': { read: 'おー', finger: 'ring-r', fill: 'fill-o' },
            'P': { read: 'ぴー', finger: 'pinky-r' },
            'Q': { read: 'きゅー', finger: 'pinky-l' },
            'R': { read: 'あーる', finger: 'index-l' },
            'S': { read: 'えす', finger: 'ring-l' },
            'T': { read: 'てぃー', finger: 'index-l' },
            'U': { read: 'ゆー', finger: 'index-r', fill: 'fill-u' },
            'V': { read: 'ぶい', finger: 'index-l' },
            'W': { read: 'だぶりゅー', finger: 'ring-l' },
            'X': { read: 'えっくす', finger: 'ring-l' },
            'Y': { read: 'わい', finger: 'index-r' },
            'Z': { read: 'ぜっと', finger: 'pinky-l' }
        };

        const kbdRows = [
            ["Q","W","E","R","T","Y","U","I","O","P"],
            ["A","S","D","F","G","H","J","K","L"],
            ["Z","X","C","V","B","N","M"]
        ];

        const alphaKeys = Object.keys(charData);
        let cleared = new Set(); // 永続的な全体のクリア記録
        let sessionCleared = new Set(); // 今プレイ中のクリア記録
        
        let currentTarget = "";
        let audioCtx;
        let voiceMode = 'kana';
        let currentLayout = 'abc';
        
        // プレイ中の統計用変数
        let totalQuestions = 26; // 今回の最大問題数
        let currentQuestionsList = []; // 出題配列
        let currentQuestionIndex = 0; // 今何問目か
        let firstTryCorrectCount = 0; // 一発正解数
        let currentTargetMistakes = 0; // 現在の問題のミスカウント
        let mistakesMap = {}; // 間違えたアルファベットの回数をカウント

        // iOS/Android向け Web Speech API & Web Audio API アンロック処理
        function unlockAudio() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
            if (audioCtx && audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
            const silentUttr = new SpeechSynthesisUtterance("");
            silentUttr.volume = 0;
            speechSynthesis.speak(silentUttr);
        }

        function setVoiceMode(mode) {
            voiceMode = mode;
            document.getElementById('mode-native').classList.toggle('active', mode === 'native');
            document.getElementById('mode-kana').classList.toggle('active', mode === 'kana');
            
            unlockAudio();
            const uttr = new SpeechSynthesisUtterance(mode === 'native' ? "Ready" : "スタート");
            uttr.lang = mode === 'native' ? 'en-US' : 'ja-JP';
            speechSynthesis.cancel();
            speechSynthesis.speak(uttr);
        }

        // もんだい数を選択する
        function setQuestionCount(count) {
            totalQuestions = count;
            document.getElementById('q-5').classList.toggle('active', count === 5);
            document.getElementById('q-10').classList.toggle('active', count === 10);
            document.getElementById('q-all').classList.toggle('active', count === 26);
            unlockAudio();
        }

        function switchMapLayout(layout) {
            currentLayout = layout;
            const container = document.getElementById('collectionContainer');
            
            document.getElementById('layoutHideBtn').classList.toggle('active', layout === 'hide');
            document.getElementById('layoutAbcBtn').classList.toggle('active', layout === 'abc');
            document.getElementById('layoutKbdBtn').classList.toggle('active', layout === 'keyboard');
            
            if (layout === 'hide') {
                container.classList.add('map-hidden');
            } else {
                container.classList.remove('map-hidden');
                renderCollectionMap();
            }
        }

        function createSlot(c) {
            const s = document.createElement('div');
            const data = charData[c];
            // 全体または今セッションでクリアされたら点灯
            const isActive = cleared.has(c) || sessionCleared.has(c);
            s.className = `char-slot border-${data.finger} ${isActive ? 'active' : ''} ${data.fill || ''}`;
            s.textContent = c;
            return s;
        }

        function renderCollectionMap() {
            if (currentLayout === 'hide') return;
            const grid = document.getElementById('collectionGrid');
            grid.innerHTML = "";
            
            if (currentLayout === 'abc') {
                const row = document.createElement('div'); row.className = 'kbd-row';
                alphaKeys.forEach(c => {
                    row.appendChild(createSlot(c));
                    if(c === 'M') { grid.appendChild(row.cloneNode(true)); row.innerHTML = ""; }
                });
                grid.appendChild(row);
            } else {
                kbdRows.forEach(rowArr => {
                    const rowDiv = document.createElement('div'); rowDiv.className = 'kbd-row';
                    rowArr.forEach(c => { rowDiv.appendChild(createSlot(c)); });
                    grid.appendChild(rowDiv);
                });
            }
        }

        function initGame() {
            unlockAudio();
            document.getElementById('start-screen').style.display = 'none';
            
            // プレイデータ初期化
            sessionCleared.clear();
            currentQuestionIndex = 0;
            firstTryCorrectCount = 0;
            mistakesMap = {};
            
            // ランダムに問題を選び出す
            const shuffled = [...alphaKeys].sort(() => Math.random() - 0.5);
            currentQuestionsList = shuffled.slice(0, Math.min(totalQuestions, alphaKeys.length));
            totalQuestions = currentQuestionsList.length; // 念のため実際のリストの長さで合わせる

            renderCollectionMap();
            nextQuestion();
        }

        function playCurrentTarget() {
            if (!currentTarget) return;
            unlockAudio();
            speechSynthesis.cancel();
            
            const uttr = new SpeechSynthesisUtterance();
            if (voiceMode === 'native') {
                uttr.text = currentTarget;
                uttr.lang = 'en-US';
                uttr.rate = 0.8;
            } else {
                uttr.text = charData[currentTarget].read;
                uttr.lang = 'ja-JP';
                uttr.rate = 1.0;
            }
            speechSynthesis.speak(uttr);
        }

        function nextQuestion() {
            if (currentQuestionIndex >= currentQuestionsList.length) {
                return showResult();
            }

            document.getElementById('status-msg').textContent = "";
            currentTarget = currentQuestionsList[currentQuestionIndex];
            currentTargetMistakes = 0;
            
            document.getElementById('reading-display').textContent = charData[currentTarget].read;
            
            let choices = [currentTarget];
            while(choices.length < 4) {
                let randomChar = alphaKeys[Math.floor(Math.random() * alphaKeys.length)];
                if(!choices.includes(randomChar)) choices.push(randomChar);
            }
            choices.sort(() => Math.random() - 0.5);

            const grid = document.getElementById('choicesGrid');
            grid.innerHTML = "";
            choices.forEach(c => {
                const card = document.createElement('div');
                card.className = 'choice-card';
                card.textContent = c;
                
                let answered = false;
                const handleAnswer = (e) => {
                    e.preventDefault();
                    if (answered) return;
                    answered = true;
                    checkAnswer(c, card);
                };
                card.addEventListener('touchend', handleAnswer, { passive: false });
                card.addEventListener('click', handleAnswer);
                grid.appendChild(card);
            });

            setTimeout(playCurrentTarget, 400);
        }

        function checkAnswer(selected, element) {
            unlockAudio();
            if (selected === currentTarget) {
                element.classList.add('correct');
                
                // 初回正解数をカウント
                if (currentTargetMistakes === 0) {
                    firstTryCorrectCount++;
                }
                
                cleared.add(currentTarget);
                sessionCleared.add(currentTarget);
                renderCollectionMap();
                
                document.getElementById('status-msg').textContent = "すごい！";
                playSfx(659, 0.3);
                
                currentQuestionIndex++;
                setTimeout(nextQuestion, 1200);
            } else {
                element.classList.add('wrong');
                currentTargetMistakes++;
                
                // 苦手な文字のミス回数を記録
                mistakesMap[currentTarget] = (mistakesMap[currentTarget] || 0) + 1;
                
                document.getElementById('status-msg').textContent = "えらびなおそう!";
                playSfx(150, 0.2);
                setTimeout(() => {
                    element.classList.remove('wrong');
                    // 回答フラグをリセットさせるため、このカードを再活性化可能にする
                    // タップ終了イベントリスナーを一度きりにしているので、クリック可能にするために新しいイベントに更新するか、そのまま残します
                }, 600);
            }
        }

        function playSfx(freq, dur) {
            if(!audioCtx) return;
            const osc = audioCtx.createOscillator();
            const g = audioCtx.createGain();
            osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
            g.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + dur);
            osc.connect(g); g.connect(audioCtx.destination);
            osc.start(); osc.stop(audioCtx.currentTime + dur);
        }

        function showResult() {
            const resScreen = document.getElementById('result-screen');
            const resContent = document.getElementById('result-content');
            resScreen.style.display = 'flex';
            
            // 一発正解率（できた％）を計算
            const firstTryPercent = Math.round((firstTryCorrectCount / totalQuestions) * 100);
            const retryPercent = 100 - firstTryPercent;
            const retryCount = totalQuestions - firstTryCorrectCount;

            // にがてな文字（えらびなおしが多かった順にソート）
            const sortedMistakes = Object.entries(mistakesMap).sort((a, b) => b[1] - a[1]);
            
            let weakLettersHTML = "";
            if (sortedMistakes.length > 0) {
                weakLettersHTML = `
                    <div class="weak-letters-container">
                        <div class="weak-title">⭐ このもじを たしかめておいてね！</div>
                        <div class="weak-grid">
                `;
                sortedMistakes.forEach(([char, count]) => {
                    const data = charData[char];
                    weakLettersHTML += `
                        <div class="weak-slot border-${data.finger}">
                            ${char}
                            <span class="weak-badge">${count}</span>
                        </div>
                    `;
                });
                weakLettersHTML += `
                        </div>
                    </div>
                `;
            } else {
                // ノーミスの場合
                weakLettersHTML = `
                    <div class="perfect-badge">👑</div>
                    <p style="font-size: 16px; font-weight: bold; color: var(--gold); margin-top: 5px;">ぜんぶ いっぱつで できたよ！パーフェクト！</p>
                `;
            }

            resContent.innerHTML = `
                <div class="main-title" style="color:var(--gold); margin-bottom:10px;">できたよ！</div>
                
                <div class="result-card">
                    <div class="chart-section">
                        <!-- CSSドーナツ円グラフ -->
                        <div class="donut-chart" id="resultChart">
                            <div class="donut-center-text">
                                ${firstTryPercent}%
                                <span>いっぱつせいかい</span>
                            </div>
                        </div>
                        
                        <!-- 凡例 -->
                        <div class="legend-container">
                            <div class="legend-item">
                                <span class="legend-color ok"></span>
                                <span>できた: ${firstTryCorrectCount}もん</span>
                            </div>
                            <div class="legend-item">
                                <span class="legend-color retry"></span>
                                <span>えらびなおし: ${retryCount}もん</span>
                            </div>
                        </div>
                    </div>
                    
                    ${weakLettersHTML}
                </div>
            `;

            // ドーナツグラフのConic Gradientを設定
            const resultChart = document.getElementById('resultChart');
            if (resultChart) {
                // もしパーフェクト（100%）なら全体をsuccess色に、そうでなければ比率分
                resultChart.style.background = `conic-gradient(var(--success) 0% ${firstTryPercent}%, #ffeaa7 ${firstTryPercent}% 100%)`;
            }

            // 紙吹雪アニメーション
            for(let i=0; i<60; i++) {
                const c = document.createElement('div');
                c.style.cssText = `position:fixed; width:8px; height:8px; background:hsl(${Math.random()*360},80%,65%); top:-10px; left:${Math.random()*100}vw; z-index:1100; pointer-events:none; border-radius:50%;`;
                document.body.appendChild(c);
                c.animate([
                    { transform: 'translateY(0) rotate(0)' },
                    { transform: `translateY(105vh) rotate(${Math.random()*360}deg)` }
                ], { 
                    duration: 1500 + Math.random()*2000, 
                    easing: 'ease-out' 
                }).onfinish = () => c.remove();
            }
        }
    </script>
</body>
</html>
