<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>アルファベット おおもじあて</title>
    <link rel="stylesheet" href="css/common.css">
    <script src="js/common.js"></script>
    <style>
        body {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            touch-action: manipulation;
        }

        /* ゲームボード（上下2列のレスポンシブな折り返しレイアウト） */
        .game-board { 
            display: flex; 
            flex-direction: column; 
            gap: 15px; 
            padding: 20px; 
            background: white; 
            border-radius: 25px; 
            box-shadow: 0 8px 30px rgba(0,0,0,0.05); 
            width: 95%; 
            max-width: 620px; 
            align-items: center;
            margin: 0 auto;
        }
        
        /* カードが横に1列に並ぶコンテナ */
        .card-container { 
            display: flex; 
            flex-direction: row; 
            flex-wrap: nowrap; 
            justify-content: center; 
            gap: 10px; 
            width: 100%; 
        }

        /* 矢印ガイド付きの仕切り線コンテナ */
        .board-divider-container {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 15px;
            width: 100%;
            margin: 5px 0;
            user-select: none;
        }
        
        .board-arrow-text {
            font-size: 13px;
            font-weight: bold;
            color: #bdc3c7;
            letter-spacing: 1px;
        }

        .board-arrow {
            font-size: 16px;
            color: var(--primary);
            display: inline-block;
            animation: bounceUp 1.5s infinite ease-in-out;
        }

        /* 矢印が上にふわふわ跳ねるアニメーション */
        @keyframes bounceUp {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-6px); }
        }
        
        /* ドラッグ/タップ用アルファベットカード */
        .draggable { 
            width: 82px; height: 90px; background: var(--primary); color: white; 
            display: flex; flex-direction: column; justify-content: center; align-items: center; 
            border-radius: 12px; cursor: grab; box-shadow: 0 5px 0 #2980b9; 
            transition: transform 0.2s, box-shadow 0.2s;
            user-select: none;
        }
        .draggable:active { transform: translateY(4px); box-shadow: none; }
        
        /* タブレット・スマホ用の選択中スタイル */
        .draggable.selected {
            transform: scale(1.1) translateY(-5px);
            box-shadow: 0 0 0 4px var(--primary), 0 10px 20px rgba(52, 152, 219, 0.4);
            z-index: 10;
        }

        .main-char { font-size: 38px; font-weight: bold; line-height: 1; }
        .reading-char { font-size: 13px; margin-top: 4px; font-weight: normal; opacity: 0.9; }

        /* ドロップゾーン */
        .dropzone { 
            width: 88px; height: 80px; border: 2.5px dashed #cbd5e0; 
            display: flex; justify-content: center; align-items: center; 
            font-size: 40px; font-weight: bold; color: #cbd5e0; border-radius: 15px; 
            transition: all 0.2s;
            cursor: pointer;
            user-select: none;
        }
        .dropzone.success { border-style: solid; border-color: var(--success); color: var(--success); background: #eafaf1; animation: pop 0.3s; }

        @keyframes pop { 50% { transform: scale(1.15); } }
        
        .btn { padding: 15px 40px; font-size: 20px; cursor: pointer; border-radius: 50px; border: none; background: var(--primary); color: white; font-weight: bold; box-shadow: 0 4px 15px rgba(0,0,0,0.1); transition: 0.3s; }
        .btn:hover { transform: scale(1.05); }

        /* つぎのステージへボタン（画面中央にポップアップ配置） */
        #nextBtn { 
            position: fixed; 
            top: 50%; 
            left: 50%; 
            transform: translate(-50%, -50%) scale(0.5); 
            z-index: 600; 
            background: linear-gradient(135deg, var(--gold), #f39c12); 
            box-shadow: 0 15px 35px rgba(243, 156, 18, 0.5), 0 0 0 10px rgba(255, 255, 255, 0.8); 
            font-size: clamp(20px, 5vw, 28px);
            padding: 22px 50px;
            border-radius: 60px;
            border: 4px solid white;
            visibility: hidden;
            opacity: 0;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            white-space: nowrap;
        }
        #nextBtn.show {
            visibility: visible;
            opacity: 1;
            transform: translate(-50%, -50%) scale(1);
        }

        .stats-card { background: #fff; padding: 20px; border-radius: 20px; border: 2px solid #eee; margin: 15px auto; box-shadow: 0 10px 20px rgba(0,0,0,0.05); width: 85%; max-width: 440px; }
        .stat-detail { text-align: left; font-size: 16px; color: #555; margin: 10px 0; display: flex; justify-content: space-between; border-bottom: 1px dashed #eee; padding-bottom: 5px; }

        /* アプリ別テーマカラー（おおもじ = Teal） */
        .collection-container {
            background: #f0fdfa !important;
            border: 2px solid #99f6e4;
            box-shadow: none !important;
        }

        /* ドーナツグラフスタイル */
        .donut-chart {
            width: 140px;
            height: 140px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            margin: 15px auto;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }
        .donut-chart::before {
            content: "";
            position: absolute;
            width: 95px;
            height: 95px;
            background: white;
            border-radius: 50%;
        }
        .donut-chart-text {
            position: relative;
            z-index: 1;
            font-size: 24px;
            font-weight: bold;
            color: #333;
            text-align: center;
            line-height: 1.2;
        }
        .donut-chart-text span {
            font-size: 11px;
            display: block;
            color: #7f8c8d;
            font-weight: normal;
        }

        /* グラフの凡例 */
        .legend-container {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin: 10px 0;
            font-size: 13px;
            font-weight: bold;
        }
        .legend-item {
            display: flex;
            align-items: center;
            gap: 5px;
        }
        .legend-color {
            width: 12px;
            height: 12px;
            border-radius: 3px;
        }

        /* スマホ・極小画面用レイアウト調整 */
        @media (max-width: 600px) {
            .char-slot {
                border-width: 1.5px;
                border-radius: 4px;
            }
            .collection-container {
                padding: 10px 5px;
            }
            .game-board {
                gap: 10px;
                padding: 12px;
            }
            .card-container {
                gap: 8px;
            }
            .draggable {
                width: 64px; height: 72px;
                box-shadow: 0 4px 0 #2980b9;
                border-radius: 10px;
            }
            .draggable:active { transform: translateY(3px); }
            .main-char { font-size: 28px; }
            .reading-char { font-size: 10px; }
            .dropzone {
                width: 68px; height: 64px;
                font-size: 30px;
                border-radius: 10px;
                border-width: 2px;
            }
            .board-divider-container {
                margin: 2px 0;
            }
            .board-arrow-text {
                font-size: 11px;
            }
            .board-arrow {
                font-size: 13px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div id="start-screen" class="screen screen-active">
            <h1 class="main-title" style="margin-bottom: 20px;">アルファベット おおもじあて</h1>
            
            <div class="settings-card" style="text-align: left;">
                <div class="settings-row">
                    <span class="settings-label">🔊 おと と こえ</span>
                    <div class="toggle-group">
                        <button id="soundMasterBtn" class="toggle-item active" onclick="SoundController.toggle()">おと・こえ: ON</button>
                        <button id="soundMasterBtnOff" class="toggle-item" onclick="SoundController.toggle()">おと・こえ: OFF</button>
                    </div>
                </div>

                <div class="settings-row">
                    <span class="settings-label">🗣️ こえの しゅるい</span>
                    <div class="toggle-group">
                        <button id="voiceModeJaBtn" class="toggle-item active" onclick="setVoiceMode('ja')">にほんご</button>
                        <button id="voiceModeEnBtn" class="toggle-item" onclick="setVoiceMode('en')">ネイティブ（えいご）</button>
                    </div>
                </div>

                <div class="settings-row">
                    <span class="settings-label">📝 もんだいの かず</span>
                    <div class="toggle-group">
                        <button id="qNum5" class="toggle-item active" onclick="setQuestionNum(5)">5もん</button>
                        <button id="qNum10" class="toggle-item" onclick="setQuestionNum(10)">10もん</button>
                        <button id="qNumAll" class="toggle-item" onclick="setQuestionNum(26)">ぜんぶ</button>
                    </div>
                </div>

                <div style="margin-top: 25px; text-align: center;">
                    <button class="btn-pop btn-pop-success" style="font-size: 20px; padding: 14px 45px;" onclick="initGame()">はじめる</button>
                </div>
            </div>
        </div>

        <div id="game-screen" class="screen">
            <div class="game-header">
                <div id="q-counter">もんだい: 1 / 26</div>
                <div id="score-counter">いっぱつOK: 0</div>
            </div>

            <div class="collection-container" id="collectionContainer">
                <div class="collection-header">
                    <div style="font-size: 11px; color: #666; font-weight: bold; letter-spacing: 0.5px;">こたえたアルファベット</div>
                    <div id="layoutControls">
                        <button id="layoutHideBtn" class="layout-switch-btn" onclick="switchMapLayout('hide')">かくす</button>
                        <button id="layoutAbcBtn" class="layout-switch-btn active" onclick="switchMapLayout('abc')">ABC</button>
                        <button id="layoutKbdBtn" class="layout-switch-btn" onclick="switchMapLayout('keyboard')">キーボード</button>
                        <button class="sound-toggle-btn layout-switch-btn" onclick="SoundController.toggle()">🔊 おと: ON</button>
                        <button class="layout-switch-btn" onclick="Navigation.showQuitModal(() => goToStartScreen())" style="background: #f1f5f9; color: var(--miss);">やめる</button>
                    </div>
                </div>
                <div class="collection-grid" id="collectionGrid"></div>
            </div>

            <div id="status-msg">こもじ を うえに はこぼう！</div>

            <!-- 上下グリッド式のゲームボード -->
            <div class="game-board">
                <!-- 上段：大文字枠 -->
                <div class="card-container" id="targets"></div>
                
                <!-- 中央：上向き矢印ガイド -->
                <div class="board-divider-container">
                    <span class="board-arrow">▲</span>
                    <span class="board-arrow-text">うえに はこぼう！</span>
                    <span class="board-arrow">▲</span>
                </div>
                
                <!-- 下段：小文字カード -->
                <div class="card-container" id="sources"></div>
            </div>

            <!-- 画面中央付近に表示される、押しやすいつぎのステージボタン -->
            <button class="btn-pop btn-pop-success" id="nextBtn" onclick="startRound()">つぎの ステージへ！ ➔</button>
        </div>

        <div id="result-screen" class="screen">
            <h2 class="result-title" style="font-size: 1.8rem; font-weight: 800; color: #2c3e50; margin-bottom: 20px;">しんだん けっか</h2>
            <div id="result-content"></div>
            <div style="display: flex; gap: 12px; justify-content: center; width: 100%; max-width: 440px; margin-top: 15px;">
                <button class="btn-pop btn-pop-success" onclick="resetGame()" style="flex: 1; font-size: clamp(16px, 4vw, 20px); padding: 12px 20px;">もういちど あそぶ</button>
                <button class="btn-pop btn-pop-gray" onclick="goToStartScreen()" style="flex: 1; font-size: clamp(16px, 4vw, 20px); padding: 12px 20px;">はじめの がめん</button>
            </div>
        </div>
    </div>

    <script>
        // 画像のホームポジション色に合わせた指使い設定
        const charData = {
            'A': {read:'えー', type:'trans', finger:'pinky-l', fill:'fill-a'}, 
            'B': {read:'びー', type:'trans', finger:'index-l'}, 
            'C': {read:'しー', type:'parent', finger:'middle-l'},
            'D': {read:'でー', type:'trans', finger:'middle-l'}, 
            'E': {read:'いー', type:'trans', finger:'middle-l', fill:'fill-e'}, 
            'F': {read:'えふ', type:'trans', finger:'index-l'},
            'G': {read:'じー', type:'trans', finger:'index-l'}, 
            'H': {read:'えいち', type:'trans', finger:'index-r'}, 
            'I': {read:'あい', type:'trans', finger:'middle-r', fill:'fill-i'},
            'J': {read:'じぇー', type:'parent', finger:'index-r'}, 
            'K': {read:'けー', type:'parent', finger:'middle-r'}, 
            'L': {read:'える', type:'trans', finger:'ring-r'},
            'M': {read:'えむ', type:'parent', finger:'index-r'}, 
            'N': {read:'えぬ', type:'trans', finger:'index-r'}, 
            'O': {read:'おー', type:'parent', finger:'ring-r', fill:'fill-o'},
            'P': {read:'ぴー', type:'parent', finger:'pinky-r'}, 
            'Q': {read:'きゅー', type:'trans', finger:'pinky-l'}, 
            'R': {read:'あーる', type:'trans', finger:'index-l'},
            'S': {read:'えす', type:'parent', finger:'ring-l'}, 
            'T': {read:'てぃー', type:'trans', finger:'index-l'}, 
            'U': {read:'ゆー', type:'parent', finger:'index-r', fill:'fill-u'},
            'V': {read:'ぶい', type:'parent', finger:'index-l'}, 
            'W': {read:'だぶりゅー', type:'parent', finger:'ring-l'}, 
            'X': {read:'えっくす', type:'parent', finger:'ring-l'},
            'Y': {read:'わい', type:'trans', finger:'index-r'}, 
            'Z': {read:'ぜっと', type:'parent', finger:'pinky-l'}
        };

        const kbdRows = [
            ["Q","W","E","R","T","Y","U","I","O","P"],
            ["A","S","D","F","G","H","J","K","L"],
            ["Z","X","C","V","B","N","M"]
        ];

        let globalCleared = new Set(), sessionCleared = new Set(), startTime, roundSolved = 0;
        let isSoundEnabled = SettingsManager.get('soundEnabled');
        let voiceMode = SettingsManager.get('voiceMode');
        let currentLayout = 'abc';
        let totalQuestionsLimit = 5;
        let gameSessionList = [];
        let currentRoundLength = 0;
        let attemptsPerChar = {};
        let selectedChar = null;
        let selectedElement = null;
        let activeDragEl = null;
        let touchStartX = 0, touchStartY = 0;
        let elStartX = 0, elStartY = 0;

        const alpha = Object.keys(charData);

        function setQuestionNum(num) {
            totalQuestionsLimit = num;
            document.getElementById('qNum5').classList.toggle('active', num === 5);
            document.getElementById('qNum10').classList.toggle('active', num === 10);
            document.getElementById('qNumAll').classList.toggle('active', num === 26);
            if (window.SpeechManager) SpeechManager.unlock();
        }

        function toggleSoundMaster() {
            isSoundEnabled = !isSoundEnabled;
            SettingsManager.set('soundEnabled', isSoundEnabled);
            updateSettingsUI();
            if (window.SpeechManager) SpeechManager.unlock();
        }

        function setVoiceMode(mode) {
            voiceMode = mode;
            SettingsManager.set('voiceMode', mode);
            updateSettingsUI();
            if (window.SpeechManager) SpeechManager.unlock();
            SpeechManager.speak(mode === 'en' ? "Ready" : "スタート");
        }

        function updateSettingsUI() {
            const enabled = SettingsManager.get('soundEnabled');
            const vMode = SettingsManager.get('voiceMode');
            document.getElementById('soundMasterBtn').classList.toggle('active', enabled);
            document.getElementById('soundMasterBtnOff').classList.toggle('active', !enabled);
            document.getElementById('voiceModeJaBtn').classList.toggle('active', vMode === 'ja');
            document.getElementById('voiceModeEnBtn').classList.toggle('active', vMode === 'en');
        }

        // ページロード時の初期設定復元
        window.addEventListener('DOMContentLoaded', () => {
            isSoundEnabled = SettingsManager.get('soundEnabled') ?? true;
            voiceMode = SettingsManager.get('voiceMode') || 'ja';
            updateSettingsUI();
        });

        // アルファベット音声の読み上げ
        function speakChar(char) {
            if (!isSoundEnabled) return;
            if (voiceMode === 'en') {
                SpeechManager.speak(char, 'en');
            } else {
                SpeechManager.speak(charData[char].read, 'ja');
            }
        }

        function switchMapLayout(layout) {
            currentLayout = layout;
            const container = document.getElementById('collectionContainer');
            document.getElementById('layoutHideBtn').classList.toggle('active', layout === 'hide');
            document.getElementById('layoutAbcBtn').classList.toggle('active', layout === 'abc');
            document.getElementById('layoutKbdBtn').classList.toggle('active', layout === 'keyboard');
            if (layout === 'hide') { container.classList.add('map-hidden'); } 
            else { container.classList.remove('map-hidden'); renderCollectionMap(); }
        }

        function renderCollectionMap() {
            if (currentLayout === 'hide') return;
            const grid = document.getElementById('collectionGrid');
            grid.innerHTML = "";
            if (currentLayout === 'abc') {
                let row = document.createElement('div'); row.className = 'kbd-row';
                alpha.forEach(c => { row.appendChild(createSlot(c)); if(c === 'M') { grid.appendChild(row); row = document.createElement('div'); row.className = 'kbd-row'; } });
                grid.appendChild(row);
            } else {
                kbdRows.forEach(rowArr => {
                    const rowDiv = document.createElement('div'); rowDiv.className = 'kbd-row';
                    rowArr.forEach(c => { rowDiv.appendChild(createSlot(c)); });
                    grid.appendChild(rowDiv);
                });
            }
        }

        function createSlot(c) {
            const s = document.createElement('div');
            const data = charData[c];
            const isActive = globalCleared.has(c) || sessionCleared.has(c);
            s.className = `char-slot f-${data.finger} ${isActive ? 'active' : ''} ${data.fill || ''}`;
            s.textContent = c;
            return s;
        }

        function initGame() {
            if (window.SpeechManager) SpeechManager.unlock();
            window.addEventListener('touchmove', handleWindowTouchMove, { passive: false });
            window.addEventListener('touchend', handleWindowTouchEnd, { passive: false });
            window.addEventListener('mousemove', handleWindowMouseMove);
            window.addEventListener('mouseup', handleWindowMouseUp);
            document.body.addEventListener('click', (e) => {
                if (!e.target.closest('.draggable') && !e.target.closest('.dropzone') && selectedElement) {
                    selectedElement.classList.remove('selected');
                    selectedElement = null; selectedChar = null;
                    document.getElementById('status-msg').textContent = "こもじ を えらんでね！";
                }
            });
            showScreen('game-screen');
            startTime = Date.now(); 
            sessionCleared.clear();
            gameSessionList = [...alpha].sort(() => Math.random() - 0.5).slice(0, totalQuestionsLimit);
            attemptsPerChar = {};
            renderCollectionMap(); 
            startRound();
        }

        function selectCharCard(el, char) {
            if (selectedElement) selectedElement.classList.remove('selected');
            if (selectedElement === el) {
                selectedElement = null; selectedChar = null;
                document.getElementById('status-msg').textContent = "こもじ を えらんでね！";
            } else {
                selectedElement = el; selectedChar = char;
                el.classList.add('selected');
                document.getElementById('status-msg').textContent = `「${char.toLowerCase()}」を うえに はこぼう！`;
            }
        }

        function dropOn(dz, char) {
            if (!char) return;
            if (dz.classList.contains('success')) return;

            if (dz.getAttribute('data-char') === char) {
                dz.classList.add('success');
                dz.textContent = char.toLowerCase();
                if (selectedElement) { selectedElement.style.visibility = 'hidden'; selectedElement.classList.remove('selected'); }
                selectedElement = null; selectedChar = null;
                sessionCleared.add(char);
                globalCleared.add(char);
                renderCollectionMap();
                updateHeader();
                document.getElementById('status-msg').textContent = "正解！";
                document.getElementById('status-msg').style.color = "var(--success)";
                AudioManager.play('ok');
                speakChar(char);
                roundSolved++;
                if (roundSolved >= currentRoundLength) {
                    const remaining = gameSessionList.filter(c => !sessionCleared.has(c));
                    if (remaining.length === 0) {
                        document.getElementById('status-msg').textContent = "ゲームクリア！";
                        setTimeout(() => {
                            showResult();
                        }, 1200);
                    } else {
                        document.getElementById('status-msg').textContent = "ステージクリア！";
                        document.getElementById('nextBtn').classList.add('show');
                    }
                }
            } else {
                dz.style.borderColor = "var(--miss)";
                dz.style.color = "var(--miss)";
                document.getElementById('status-msg').textContent = "ちがうみたい…";
                document.getElementById('status-msg').style.color = "var(--miss)";
                AudioManager.play('ng');
                attemptsPerChar[char] = (attemptsPerChar[char] || 0) + 1;
                
                setTimeout(() => {
                    dz.style.borderColor = ""; dz.style.color = "";
                }, 800);

                if (selectedElement) selectedElement.classList.remove('selected');
                selectedElement = null; selectedChar = null;
            }
        }

        function showScreen(screenId) {
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('screen-active'));
            document.getElementById(screenId).classList.add('screen-active');
        }

        function resetGame() {
            if (window.SpeechManager) SpeechManager.unlock();
            showScreen('game-screen');
            sessionCleared.clear();
            roundSolved = 0;
            startTime = Date.now();
            gameSessionList = [...alpha].sort(() => Math.random() - 0.5).slice(0, totalQuestionsLimit);
            attemptsPerChar = {};
            renderCollectionMap();
            startRound();
        }

        function goToStartScreen() {
            if (window.SpeechManager) SpeechManager.unlock();
            showScreen('start-screen');
            sessionCleared.clear();
            roundSolved = 0;
            gameSessionList = [];
            attemptsPerChar = {};
            document.getElementById('sources').innerHTML = "";
            document.getElementById('targets').innerHTML = "";
            document.getElementById('nextBtn').classList.remove('show');
            renderCollectionMap();
        }

        function updateHeader() {
            document.getElementById('q-counter').innerText = `もんだい: ${sessionCleared.size} / ${totalQuestionsLimit}`;
            const failedCount = Object.keys(attemptsPerChar).filter(c => attemptsPerChar[c] > 0).length;
            document.getElementById('score-counter').innerText = `いっぱつOK: ${sessionCleared.size - failedCount}`;
        }

        function startRound() {
            updateHeader();
            const src = document.getElementById('sources'), tgt = document.getElementById('targets');
            src.innerHTML = ""; tgt.innerHTML = "";
            document.getElementById('nextBtn').classList.remove('show');
            roundSolved = 0;
            const remaining = gameSessionList.filter(c => !sessionCleared.has(c));
            if (remaining.length === 0) return showResult();
            const current = remaining.slice(0, 5);
            currentRoundLength = current.length;
            [...current].sort(() => Math.random() - 0.5).forEach(c => {
                const d = document.createElement('div');
                d.className = 'draggable'; 
                d.innerHTML = `<span class="main-char">${c.toLowerCase()}</span><span class="reading-char">${charData[c].read}</span>`;
                d.addEventListener('click', (e) => { e.stopPropagation(); selectCharCard(d, c); });
                d.addEventListener('touchstart', (e) => {
                    e.stopPropagation(); selectCharCard(d, c); activeDragEl = d;
                    const touch = e.touches[0]; touchStartX = touch.clientX; touchStartY = touch.clientY;
                    const rect = d.getBoundingClientRect(); elStartX = rect.left; elStartY = rect.top;
                    d.style.position = 'fixed'; d.style.left = `${elStartX}px`; d.style.top = `${elStartY}px`; d.style.zIndex = '1000';
                    d.style.pointerEvents = 'none';
                }, { passive: false });
                d.addEventListener('mousedown', (e) => {
                    if (e.button !== 0) return;
                    e.preventDefault();
                    e.stopPropagation();
                    selectCharCard(d, c);
                    activeDragEl = d;
                    touchStartX = e.clientX;
                    touchStartY = e.clientY;
                    const rect = d.getBoundingClientRect();
                    elStartX = rect.left;
                    elStartY = rect.top;
                    d.style.position = 'fixed';
                    d.style.left = `${elStartX}px`;
                    d.style.top = `${elStartY}px`;
                    d.style.zIndex = '1000';
                    d.style.pointerEvents = 'none';
                });
                src.appendChild(d);
            });
            [...current].sort(() => Math.random() - 0.5).forEach(c => {
                const z = document.createElement('div');
                z.className = 'dropzone'; z.textContent = c; z.setAttribute('data-char', c);
                z.addEventListener('click', (e) => { e.stopPropagation(); if (selectedChar) dropOn(z, selectedChar); });
                tgt.appendChild(z);
            });
        }

        function handleWindowTouchMove(e) {
            if (!activeDragEl) return;
            e.preventDefault();
            const touch = e.touches[0];
            activeDragEl.style.left = `${elStartX + (touch.clientX - touchStartX)}px`;
            activeDragEl.style.top = `${elStartY + (touch.clientY - touchStartY)}px`;
        }

        function findOverlappingDropzone(dragEl, fallbackX, fallbackY) {
            const dragRect = dragEl.getBoundingClientRect();
            const dragCenterX = dragRect.left + dragRect.width / 2;
            const dragCenterY = dragRect.top + dragRect.height / 2;

            const dropzones = Array.from(document.querySelectorAll('.dropzone:not(.success)'));
            
            // 1. カードの中心点がドロップゾーン内（±15pxの許容マージン付き）にあるかを優先判定
            for (const zone of dropzones) {
                const zRect = zone.getBoundingClientRect();
                if (dragCenterX >= zRect.left - 15 && dragCenterX <= zRect.right + 15 &&
                    dragCenterY >= zRect.top - 15 && dragCenterY <= zRect.bottom + 15) {
                    return zone;
                }
            }

            // 2. 最も重なり面積が大きい未正解ゾーンを判定（少しズレていてもカードの15%以上重なっていればOK）
            let bestZone = null;
            let maxOverlapArea = 0;
            const dragArea = dragRect.width * dragRect.height;

            for (const zone of dropzones) {
                const zRect = zone.getBoundingClientRect();
                const overlapWidth = Math.max(0, Math.min(dragRect.right, zRect.right) - Math.max(dragRect.left, zRect.left));
                const overlapHeight = Math.max(0, Math.min(dragRect.bottom, zRect.bottom) - Math.max(dragRect.top, zRect.top));
                const overlapArea = overlapWidth * overlapHeight;

                if (overlapArea > dragArea * 0.15 && overlapArea > maxOverlapArea) {
                    maxOverlapArea = overlapArea;
                    bestZone = zone;
                }
            }

            if (bestZone) return bestZone;

            // 3. フォールバック：従来の指先・カーソル座標での判定
            if (fallbackX !== undefined && fallbackY !== undefined) {
                const dropTarget = document.elementFromPoint(fallbackX, fallbackY);
                return dropTarget ? dropTarget.closest('.dropzone:not(.success)') : null;
            }

            return null;
        }

        function handleWindowTouchEnd(e) {
            if (!activeDragEl) return;
            const touch = e.changedTouches[0];
            const zone = findOverlappingDropzone(activeDragEl, touch.clientX, touch.clientY);
            activeDragEl.style.pointerEvents = '';
            if (zone) dropOn(zone, selectedChar);
            activeDragEl.style.position = ''; activeDragEl.style.left = ''; activeDragEl.style.top = ''; activeDragEl.style.zIndex = '';
            activeDragEl = null;
        }

        function handleWindowMouseMove(e) {
            if (!activeDragEl) return;
            activeDragEl.style.left = `${elStartX + (e.clientX - touchStartX)}px`;
            activeDragEl.style.top = `${elStartY + (e.clientY - touchStartY)}px`;
        }

        function handleWindowMouseUp(e) {
            if (!activeDragEl) return;
            const zone = findOverlappingDropzone(activeDragEl, e.clientX, e.clientY);
            activeDragEl.style.pointerEvents = '';
            if (zone) dropOn(zone, selectedChar);
            activeDragEl.style.position = ''; activeDragEl.style.left = ''; activeDragEl.style.top = ''; activeDragEl.style.zIndex = '';
            activeDragEl = null;
        }

        function showResult() {
            document.getElementById('nextBtn').classList.remove('show');
            const totalTime = Math.floor((Date.now() - startTime) / 1000);
            const min = Math.floor(totalTime / 60), sec = totalTime % 60;
            const res = document.getElementById('result-screen');
            showScreen('result-screen');

            const totalPlayed = gameSessionList.length;
            const failedChars = Object.keys(attemptsPerChar).filter(c => attemptsPerChar[c] > 0);
            const perfectCount = totalPlayed - failedChars.length;
            const perfectRatio = totalPlayed > 0 ? Math.round((perfectCount / totalPlayed) * 100) : 0;
            const accuracyPercent = perfectRatio;
            const perfectAll = failedChars.length === 0;
            const time = totalTime;

            if (perfectAll) {
                AudioManager.play('perfect');
            } else {
                AudioManager.play('clear');
            }

            let failedGuideHTML = "";
            if (failedChars.length > 0) {
                failedGuideHTML = `
                    <div style="margin-top: 15px; font-weight: bold; color: #555; font-size: 14px;"> このもじを たしかめておいてね！🌟</div>
                    <div style="display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; margin-top: 8px;">
                        ${failedChars.map(c => `
                            <span style="background: #ffeaa7; color: #d35400; padding: 6px 12px; border-radius: 20px; font-weight: bold; font-size: 15px; border: 1px solid #f39c12; display: inline-flex; align-items: center; gap: 4px;">
                                <strong style="font-size: 18px;">${c}</strong><span style="font-size:12px; font-weight:normal; opacity:0.8;">${c.toLowerCase()}</span>
                            </span>
                        `).join('')}
                    </div>
                `;
            } else {
                failedGuideHTML = `
                    <div style="margin-top: 15px; font-weight: bold; color: #f1c40f; font-size: 16px; animation: pop 1s infinite alternate;">👑 ぜんぶ いっぱつで できたよ！👑</div>
                `;
            }

            document.getElementById('result-content').innerHTML = `
                <div style="font-size:32px; font-weight:bold; color:var(--gold); margin-bottom:10px;">*** ${perfectAll ? 'パーフェクト' : 'クリア'} ***</div>
                <div class="stats-card">
                    <div class="donut-chart" style="background: conic-gradient(var(--success) 0% ${perfectRatio}%, var(--retry) ${perfectRatio}% 100%);">
                        <div class="donut-chart-text">
                            ${accuracyPercent}%
                            <span>いっぱつ率</span>
                        </div>
                    </div>

                    <div class="legend-container">
                        <div class="legend-item">
                            <div class="legend-color" style="background: var(--success);"></div>
                            <span>いっぱつでできた！</span>
                        </div>
                        <div class="legend-item">
                            <div class="legend-color" style="background: var(--retry);"></div>
                            <span>あきらめずにできた！</span>
                        </div>
                    </div>

                    <div style="border-top: 1px dashed #eee; margin: 15px 0 10px 0;"></div>

                    <div class="stat-detail"><span>タイム</span> <b>${time}びょう</b></div>
                    <div class="stat-detail"><span>ぜんぶの もんだい</span> <b>${totalPlayed}もん</b></div>
                    <div class="stat-detail"><span>いっぱつで できた！</span> <b style="color:var(--success);">${perfectCount}もん</b></div>
                    
                    ${failedGuideHTML}
                </div>
            `;

            for(let i=0; i<80; i++) {
                const c = document.createElement('div');
                c.style.cssText = `position:fixed; width:10px; height:10px; background:hsl(${Math.random()*360},70%,60%); top:-10px; left:${Math.random()*100}vw; z-index:1100; pointer-events:none;`;
                document.body.appendChild(c);
                c.animate([{ transform: 'translateY(0) rotate(0)' }, { transform: `translateY(105vh) rotate(${Math.random()*720}deg)` }], { duration: 2000 + Math.random()*2000, easing: 'cubic-bezier(0,1,1,1)' }).onfinish = () => c.remove();
            }
        }
    </script>
