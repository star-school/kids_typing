<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>アルファベットよみ がくしゅう</title>
    <!-- Google Fonts の読み込み -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Kosugi+Maru&family=Mochiy+Pop+One&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-color: #f7f9fc;
            --main-color: #4a90e2;
            --text-color: #2c3e50;
            --card-bg: #ffffff;
            --shadow: 0 8px 24px rgba(149, 157, 165, 0.2);
            --font-main: 'Kosugi Maru', sans-serif;
            --font-pop: 'Mochiy Pop One', sans-serif;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
        }

        body {
            font-family: var(--font-main);
            background-color: var(--bg-color);
            color: var(--text-color);
            line-height: 1.6;
            padding: 20px;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        /* 画面全体のコンテナ */
        .container {
            width: 100%;
            max-width: 700px;
            background: var(--card-bg);
            border-radius: 30px;
            padding: 30px;
            box-shadow: var(--shadow);
            border: 4px solid #e2e8f0;
            text-align: center;
            position: relative;
        }

        h1 {
            font-family: var(--font-pop);
            color: #2c3e50;
            font-size: 2.2rem;
            margin-bottom: 10px;
            text-shadow: 2px 2px 0px #e2e8f0;
        }

        .subtitle {
            font-size: 1.1rem;
            color: #7f8c8d;
            margin-bottom: 30px;
            font-weight: bold;
        }

        .screen { display: none; }
        .screen.screen-active { display: block; }

        /* 設定エリア */
        .config-box {
            background: #f8fafc;
            border: 2px dashed #cbd5e1;
            border-radius: 20px;
            padding: 20px;
            margin: 20px auto;
            max-width: 500px;
        }
        .config-title {
            font-family: var(--font-pop);
            font-size: 1.1rem;
            margin-bottom: 12px;
            color: #475569;
        }
        .btn-group {
            display: flex;
            justify-content: center;
            gap: 12px;
            margin-bottom: 20px;
        }
        .btn-opt {
            background: white;
            border: 2px solid #cbd5e1;
            padding: 10px 24px;
            border-radius: 50px;
            font-family: var(--font-pop);
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.2s;
        }
        .btn-opt.selected {
            background: var(--main-color);
            color: white;
            border-color: var(--main-color);
            box-shadow: 0 4px 12px rgba(74, 144, 226, 0.3);
        }
        .btn-start {
            background: #2ecc71;
            color: white;
            border: none;
            padding: 14px 40px;
            border-radius: 50px;
            font-family: var(--font-pop);
            font-size: 1.4rem;
            cursor: pointer;
            box-shadow: 0 6px 16px rgba(46, 204, 113, 0.3);
            transition: all 0.2s;
            margin-top: 10px;
        }
        .btn-start:active, .btn-start:hover {
            transform: scale(1.03);
        }

        /* ゲーム表示 */
        .game-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-family: var(--font-pop);
            font-size: 1.1rem;
            color: #64748b;
            margin-bottom: 20px;
            border-bottom: 2px solid #f1f5f9;
            padding-bottom: 10px;
        }
        
        .char-container {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 20px;
            margin: 15px 0;
            position: relative;
        }

        .question-display {
            font-family: var(--font-pop);
            font-size: 7.5rem;
            color: #2c3e50;
            line-height: 1.1;
            animation: popIn 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        /* スピーカーボタン */
        .btn-speaker {
            background: #e2e8f0;
            border: none;
            width: 50px;
            height: 50px;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
        }
        .btn-speaker:hover {
            background: #cbd5e1;
            transform: scale(1.05);
        }
        .btn-speaker:active {
            transform: scale(0.95);
        }
        .btn-speaker svg {
            width: 26px;
            height: 26px;
            fill: #475569;
        }

        .choices-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
            max-width: 500px;
            margin: 0 auto 10px auto;
        }
        .btn-choice {
            background: white;
            border: 3px solid #e2e8f0;
            border-radius: 20px;
            padding: 16px;
            font-family: var(--font-pop);
            font-size: 1.5rem;
            cursor: pointer;
            box-shadow: 0 4px 6px rgba(0,0,0,0.02);
            transition: all 0.2s;
        }
        .btn-choice:active {
            transform: scale(0.95);
        }

        /* 演出用浮き上がりテキスト */
        .feedback-overlay {
            position: absolute;
            top: 40%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-family: var(--font-pop);
            font-size: 2.8rem;
            pointer-events: none;
            opacity: 0;
            z-index: 10;
            white-space: nowrap;
        }
        @keyframes floatUp {
            0% { transform: translate(-50%, -30%) scale(0.5); opacity: 0; }
            30% { transform: translate(-50%, -50%) scale(1.1); opacity: 1; }
            80% { transform: translate(-50%, -60%) scale(1); opacity: 1; }
            100% { transform: translate(-50%, -70%) scale(0.8); opacity: 0; }
        }

        /* ドーナツグラフ結果画面 */
        .result-title {
            font-family: var(--font-pop);
            font-size: 1.8rem;
            color: #2c3e50;
            margin-bottom: 20px;
        }
        .donut-container {
            position: relative;
            width: 180px;
            height: 180px;
            margin: 0 auto 20px auto;
        }
        .donut-chart {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            background: conic-gradient(#2ecc71 0% 0%, #ff9f43 0% 100%);
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .donut-inner {
            width: 120px;
            height: 120px;
            background: white;
            border-radius: 50%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }
        .donut-percentage {
            font-family: var(--font-pop);
            font-size: 1.8rem;
            color: #2c3e50;
        }
        .donut-label {
            font-size: 0.75rem;
            color: #7f8c8d;
            font-weight: bold;
        }
        .legend {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-bottom: 20px;
            font-size: 0.9rem;
            font-weight: bold;
        }
        .legend-item { display: flex; align-items: center; gap: 6px; }
        .color-box { width: 14px; height: 14px; border-radius: 4px; }

        /* 応援ボックス */
        .review-box {
            background: #f8fafc;
            border-radius: 20px;
            padding: 15px;
            max-width: 500px;
            margin: 0 auto 25px auto;
            border: 2px solid #e2e8f0;
        }
        .review-title {
            font-family: var(--font-pop);
            font-size: 1rem;
            color: #64748b;
            margin-bottom: 10px;
        }
        .miss-letters {
            display: flex;
            justify-content: center;
            gap: 10px;
            flex-wrap: wrap;
        }
        .miss-chip {
            background: #fff5f5;
            border: 2px solid #feb2b2;
            color: #c53030;
            padding: 6px 12px;
            border-radius: 12px;
            font-family: var(--font-pop);
            font-size: 1.1rem;
        }
        .perfect-msg {
            color: #2ecc71;
            font-family: var(--font-pop);
            font-size: 1.2rem;
            margin: 15px 0;
        }

        .btn-action-group {
            display: flex;
            justify-content: center;
            gap: 15px;
        }
        .btn-action {
            padding: 12px 28px;
            border-radius: 50px;
            font-family: var(--font-pop);
            font-size: 1.1rem;
            cursor: pointer;
            border: none;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            transition: transform 0.2s;
        }
        .btn-action:active { transform: scale(0.97); }
        .btn-retry { background: #4a90e2; color: white; }
        .btn-home { background: #e2e8f0; color: #475569; }

        @keyframes popIn {
            0% { transform: scale(0.6); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- フィードバック演出用 -->
        <div id="feedback" class="feedback-overlay"></div>
        
        <!-- 1. スタート（設定）画面 -->
        <div id="scr-start" class="screen screen-active">
            <h1>アルファベットよみ</h1>
            <div class="subtitle">もじの 「よみかた」を 4つの なかから えらぼう！</div>
            
            <div class="config-box">
                <div class="config-title">もんだいの かず</div>
                <div class="btn-group">
                    <button class="btn-opt selected" onclick="setQCount(5, this)">5もん</button>
                    <button class="btn-opt" onclick="setQCount(10, this)">10もん</button>
                    <button class="btn-opt" onclick="setQCount(26, this)">ぜんぶ</button>
                </div>

                <div class="config-title" style="margin-top: 15px;">おとの よみあげ</div>
                <div class="btn-group">
                    <button class="btn-opt selected" onclick="setVoiceEnabled(false, this)">なし（おすすめ）</button>
                    <button class="btn-opt" onclick="setVoiceEnabled(true, this)">あり</button>
                </div>
            </div>
            <button class="btn-start" onclick="startGame()">はじめる</button>
        </div>

        <!-- 2. メインプレイ画面 -->
        <div id="scr-game" class="screen">
            <div class="game-header">
                <div id="q-counter">もんだい: 1 / 5</div>
                <div id="score-counter">いっぱつ正解: 0</div>
            </div>
            
            <!-- 出題文字とスピーカーボタン -->
            <div class="char-container">
                <!-- 空白をあけてバランスをとる -->
                <div style="width: 50px;"></div> 
                <div id="question-char" class="question-display">A</div>
                <!-- スピーカーボタン：いつでも読み方を聴けるヒント -->
                <button class="btn-speaker" onclick="speakCurrentCharacter()" title="おとをきく">
                    <svg viewBox="0 0 24 24">
                        <path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/>
                    </svg>
                </button>
            </div>
            
            <p style="color: #7f8c8d; font-weight: bold; margin-bottom: 20px;">ただしい よみかたは どっちかな？</p>
            
            <!-- 4択ボタン -->
            <div class="choices-grid" id="choices-area">
                <!-- JSで動的生成 -->
            </div>
        </div>

        <!-- 3. リザルト画面 -->
        <div id="scr-result" class="screen">
            <h2 class="result-title">しんだん けっか</h2>
            
            <!-- ドーナツグラフ -->
            <div class="donut-container">
                <div id="chart-graph" class="donut-chart">
                    <div class="donut-inner">
                        <span id="chart-per" class="donut-percentage">100%</span>
                        <span class="donut-label">できた率</span>
                    </div>
                </div>
            </div>
            
            <div class="legend">
                <div class="legend-item"><div class="color-box" style="background: #2ecc71;"></div>いっぱつで できた！</div>
                <div class="legend-item"><div class="color-box" style="background: #ff9f43;"></div>あきらめずに できた！</div>
            </div>

            <!-- 苦手な文字のやさしい応援表示 -->
            <div class="review-box">
                <div id="review-content"></div>
            </div>

            <div class="btn-action-group">
                <button class="btn-action btn-retry" onclick="startGame()">もういちど あそぶ</button>
                <button class="btn-action btn-home" onclick="goHome()">はじめの がめん</button>
            </div>
        </div>
    </div>

    <script>
        // アルファベット日本語読みデータベース
        const alphabetReading = {
            'A': 'えー', 'B': 'びー', 'C': 'しー', 'D': 'でぃー', 'E': 'いー', 'F': 'えふ', 'G': 'じー',
            'H': 'えいち', 'I': 'あい', 'J': 'じぇー', 'K': 'けー', 'L': 'える', 'M': 'えむ', 'N': 'えぬ',
            'O': 'おー', 'P': 'ぴー', 'Q': 'きゅー', 'R': 'あーる', 'S': 'えす', 'T': 'てぃー', 'U': 'ゆー',
            'V': 'ぶぃー', 'W': 'だぶりゅー', 'X': 'えっくす', 'Y': 'わい', 'Z': 'ぜっと'
        };

        // アプリケーションの状態管理
        let gState = {
            maxQuestions: 5,
            voiceEnabled: false, // デフォルト：音声読み上げオフ（基本オフ）
            currentIdx: 0,
            questionList: [],
            firstTryCorrectCount: 0,
            isFirstTry: true,
            retryLetters: new Set(),
            currentAnswer: "",
            isTransitioning: false // 次の問題への自動遷移中の二重入力防止
        };

        // 音声アンロック用
        function unlockAudio() {
            const context = new (window.AudioContext || window.webkitAudioContext)();
            if (context.state === 'suspended') { context.resume(); }
        }

        // もんだいの数を選択
        function setQCount(count, element) {
            gState.maxQuestions = count;
            const buttons = element.parentNode.querySelectorAll('.btn-opt');
            buttons.forEach(btn => btn.classList.remove('selected'));
            element.classList.add('selected');
            playAudioTone(440, 0.05);
        }

        // 音声よみあげの有無を選択
        function setVoiceEnabled(enabled, element) {
            gState.voiceEnabled = enabled;
            const buttons = element.parentNode.querySelectorAll('.btn-opt');
            buttons.forEach(btn => btn.classList.remove('selected'));
            element.classList.add('selected');
            playAudioTone(440, 0.05);
        }

        // 最初の画面に戻る
        function goHome() {
            showScreen('scr-start');
        }

        function showScreen(screenId) {
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('screen-active'));
            document.getElementById(screenId).classList.add('screen-active');
        }

        // ゲーム開始
        function startGame() {
            unlockAudio();
            gState.currentIdx = 0;
            gState.firstTryCorrectCount = 0;
            gState.retryLetters.clear();
            gState.isTransitioning = false;
            
            // アルファベット配列をシャッフルして問題リストを作成
            const keys = Object.keys(alphabetReading);
            gState.questionList = keys.sort(() => Math.random() - 0.5).slice(0, gState.maxQuestions);
            
            showScreen('scr-game');
            loadQuestion();
        }

        // 問題の読み込み
        function loadQuestion() {
            gState.isFirstTry = true;
            gState.isTransitioning = false;
            
            const currentChar = gState.questionList[gState.currentIdx];
            gState.currentAnswer = alphabetReading[currentChar];
            
            // ステータス表示
            document.getElementById('q-counter').innerText = `もんだい: ${gState.currentIdx + 1} / ${gState.maxQuestions}`;
            document.getElementById('score-counter').innerText = `いっぱつ正解: ${gState.firstTryCorrectCount}`;
            document.getElementById('question-char').innerText = currentChar;
            
            // 4択ボタンの作成（正解1つ + 誤答3つ）
            let choices = [gState.currentAnswer];
            const allReadings = Object.values(alphabetReading);
            while (choices.length < 4) {
                let randomReading = allReadings[Math.floor(Math.random() * allReadings.length)];
                if (!choices.includes(randomReading)) {
                    choices.push(randomReading);
                }
            }
            // 選択肢のシャッフル
            choices.sort(() => Math.random() - 0.5);
            
            // DOMへの適用
            const choicesArea = document.getElementById('choices-area');
            choicesArea.innerHTML = "";
            choices.forEach(choice => {
                const btn = document.createElement('button');
                btn.className = "btn-choice";
                btn.innerText = choice;
                btn.onclick = () => checkChoice(choice, btn);
                choicesArea.appendChild(btn);
            });

            // 「おとのよみあげ」が「あり」設定の時のみ、出題時に自動で発音
            if (gState.voiceEnabled) {
                speakCharacter(currentChar);
            }
        }

        // 現在の問題のアルファベット音声を発音（スピーカーボタンクリック用）
        function speakCurrentCharacter() {
            const currentChar = gState.questionList[gState.currentIdx];
            speakCharacter(currentChar);
        }

        // 音声合成による英語一音読み上げ
        function speakCharacter(char) {
            try {
                if ('speechSynthesis' in window) {
                    window.speechSynthesis.cancel();
                    const uttr = new SpeechSynthesisUtterance(char);
                    uttr.lang = 'en-US';
                    uttr.rate = 0.75; // 少しゆっくりハッキリ発音
                    window.speechSynthesis.speak(uttr);
                }
            } catch(e) {
                console.log("SpeechSynthesis error:", e);
            }
        }

        // 回答選択肢のチェック
        function checkChoice(selected, clickedBtn) {
            if (gState.isTransitioning) return; // 自動遷移中の余分な入力を無視

            if (selected === gState.currentAnswer) {
                gState.isTransitioning = true; // 遷移開始フラグ

                // 正解の挙動
                if (gState.isFirstTry) {
                    gState.firstTryCorrectCount++;
                    showFeedback("✨ せいかい！ ✨", "#2ecc71");
                    playAudioTone(523.25, 0.1); // ド
                    setTimeout(() => playAudioTone(659.25, 0.1), 100); // ミ
                    setTimeout(() => playAudioTone(783.99, 0.2), 200); // ソ
                } else {
                    showFeedback("あきらめずに できた！ 🌟", "#ff9f43");
                    playAudioTone(523.25, 0.1);
                    setTimeout(() => playAudioTone(659.25, 0.2), 100);
                }
                
                // ボタンの操作をすべてロック
                document.querySelectorAll('.btn-choice').forEach(b => b.disabled = true);
                clickedBtn.style.background = "#2ecc71";
                clickedBtn.style.color = "white";
                clickedBtn.style.borderColor = "#2ecc71";
                
                // 次のステージボタンを挟まず、1.2秒後に自動的に次の問題、または結果へ移行
                setTimeout(() => {
                    nextQuestion();
                }, 1200);

            } else {
                // 不正解・選び直しの挙動
                showFeedback("おしい！ えらびなおそう ✊", "#ff9f43");
                playAudioTone(349.23, 0.15); // ファ（低音警告）
                
                gState.isFirstTry = false;
                gState.retryLetters.add(gState.questionList[gState.currentIdx]); // 苦手リストに追加
                
                clickedBtn.disabled = true;
                clickedBtn.style.background = "#f1f5f9";
                clickedBtn.style.color = "#94a3b8";
                clickedBtn.style.borderColor = "#e2e8f0";
            }
        }

        function showFeedback(text, color) {
            const fb = document.getElementById('feedback');
            fb.innerText = text;
            fb.style.color = color;
            fb.style.animation = 'none';
            fb.offsetHeight; // リフロー
            fb.style.animation = 'floatUp 1.2s ease forwards';
        }

        // 次の問題、あるいはリザルトへ進む処理
        function nextQuestion() {
            gState.currentIdx++;
            if (gState.currentIdx < gState.maxQuestions) {
                loadQuestion();
            } else {
                showResult();
            }
        }

        // 診断結果画面の描画
        function showResult() {
            showScreen('scr-result');
            
            const total = gState.maxQuestions;
            const accuracy = Math.round((gState.firstTryCorrectCount / total) * 100);
            
            // パーセント数値の適用
            document.getElementById('chart-per').innerText = `${accuracy}%`;
            
            // CSSコニックグラデーションによるドーナツグラフ描画
            const chart = document.getElementById('chart-graph');
            chart.style.background = `conic-gradient(#2ecc71 0% ${accuracy}%, #ff9f43 ${accuracy}% 100%)`;
            
            // 苦手文字（選び直しが発生した文字）のチップ表示
            const reviewContent = document.getElementById('review-content');
            if (gState.retryLetters.size === 0) {
                reviewContent.innerHTML = `<div class="perfect-msg">👑 ぜんぶ いっぱつで できたよ！すごすぎる！ 👑</div>`;
                // パーフェクトファンファーレ効果音
                playAudioTone(523.25, 0.1);
                setTimeout(() => playAudioTone(659.25, 0.1), 100);
                setTimeout(() => playAudioTone(783.99, 0.1), 200);
                setTimeout(() => playAudioTone(1046.50, 0.4), 300);
            } else {
                let html = `<div class="review-title">つぎは これを れんしゅう してみよう！</div>`;
                html += `<div class="miss-letters">`;
                gState.retryLetters.forEach(let => {
                    html += `<div class="miss-chip">${let} (${alphabetReading[let]})</div>`;
                });
                html += `</div>`;
                reviewContent.innerHTML = html;
            }
        }

        // Web Audio APIによるシンプルなビープ音生成
        function playAudioTone(freq, duration) {
            try {
                const AudioContext = window.AudioContext || window.webkitAudioContext;
                const ctx = new AudioContext();
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                
                osc.type = 'sine';
                osc.frequency.value = freq;
                
                gain.gain.setValueAtTime(0.15, ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.00001, ctx.currentTime + duration);
                
                osc.connect(gain);
                gain.connect(ctx.destination);
                
                osc.start();
                osc.stop(ctx.currentTime + duration);
            } catch(e) {
                console.log("Audio play blocked");
            }
        }
    </script>
</body>
</html>
