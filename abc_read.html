<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>アルファベットよみ がくしゅう</title>
    <!-- 共通スタイルと共通JS -->
    <link rel="stylesheet" href="css/common.css">
    <script src="js/common.js"></script>
    
    <style>
        /* ゲーム独自の追加スタイルのみを定義 */
        body {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            touch-action: manipulation;
        }

        .char-container {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 20px;
            margin: 20px 0;
            position: relative;
        }

        /* アプリ別テーマカラー（よみ = Cyan） */
        .collection-container {
            background: #ecfeff !important;
            border: 2px solid #a5f3fc;
            box-shadow: none !important;
        }

        .question-display {
            font-size: 8rem;
            font-weight: 800;
            color: #2c3e50;
            line-height: 1.1;
            animation: popIn 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        /* スピーカーボタン */
        .btn-speaker {
            background: var(--primary);
            border: none;
            width: 60px;
            height: 60px;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: transform 0.1s, box-shadow 0.1s;
            box-shadow: 0 5px 0 #2980b9;
        }
        .btn-speaker:active {
            transform: translateY(3px);
            box-shadow: 0 2px 0 #2980b9;
        }
        .btn-speaker svg {
            width: 32px;
            height: 32px;
            fill: white;
        }

        .choices-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
            max-width: 460px;
            margin: 0 auto 10px auto;
        }
        
        /* 4択ボタン */
        .btn-choice {
            background: white;
            border: 3px solid #e2e8f0;
            border-radius: 20px;
            padding: 18px;
            font-size: 1.6rem;
            font-weight: 800;
            cursor: pointer;
            box-shadow: 0 6px 0 #cbd5e1;
            transition: transform 0.1s, box-shadow 0.1s, border-color 0.1s;
            color: #475569;
        }
        .btn-choice:active:not(:disabled) {
            transform: translateY(4px);
            box-shadow: 0 2px 0 #cbd5e1;
        }
        .btn-choice.correct {
            background: var(--success) !important;
            color: white !important;
            border-color: var(--success) !important;
            box-shadow: 0 6px 0 #27ae60 !important;
        }
        .btn-choice.correct:active {
            transform: none !important;
            box-shadow: 0 6px 0 #27ae60 !important;
        }
        .btn-choice.wrong {
            background: #f1f5f9 !important;
            color: #cbd5e1 !important;
            border-color: #cbd5e1 !important;
            box-shadow: 0 2px 0 #cbd5e1 !important;
            transform: translateY(4px);
            cursor: not-allowed;
        }

        /* 演出用浮き上がりテキスト */
        .feedback-overlay {
            position: absolute;
            top: 40%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 2.8rem;
            font-weight: 800;
            pointer-events: none;
            opacity: 0;
            z-index: 10;
            white-space: nowrap;
        }
        @keyframes floatUp {
            0% { transform: translate(-50%, -30%) scale(0.5); opacity: 0; }
            30% { transform: translate(-50%, -50%) scale(1.1); opacity: 1; }
            80% { transform: translate(-50%, -60%) scale(1); opacity: 1; }
            100% { transform: translate(-50%, -70%) scale(0.8); opacity: 0; }
        }

        /* 結果画面 */
        .result-title {
            font-size: 1.8rem;
            font-weight: 800;
            color: #2c3e50;
            margin-bottom: 20px;
        }
        
        .donut-chart {
            width: 140px;
            height: 140px;
            border-radius: 50%;
            background: conic-gradient(var(--success) 0% 0%, #ffeaa7 0% 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            box-shadow: inset 0 2px 5px rgba(0,0,0,0.05), 0 4px 10px rgba(0,0,0,0.08);
            margin: 0 auto 20px auto;
        }
        .donut-chart::before {
            content: "";
            position: absolute;
            width: 95px;
            height: 95px;
            background: white;
            border-radius: 50%;
        }
        .donut-center-text {
            position: absolute;
            font-size: 26px;
            font-weight: bold;
            color: #2c3e50;
            text-align: center;
            line-height: 1.1;
        }
        .donut-center-text span {
            font-size: 11px;
            color: #7f8c8d;
            display: block;
            margin-top: 2px;
        }

        .legend {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-bottom: 20px;
            font-size: 0.9rem;
            font-weight: bold;
        }
        .legend-item { display: flex; align-items: center; gap: 6px; }
        .color-box { width: 14px; height: 14px; border-radius: 4px; }

        /* 応援ボックス */
        .review-box {
            background: #f8fafc;
            border-radius: 20px;
            padding: 15px;
            max-width: 500px;
            margin: 0 auto 25px auto;
            border: 2px solid #e2e8f0;
        }
        .review-title {
            font-size: 1rem;
            font-weight: 800;
            color: #64748b;
            margin-bottom: 10px;
        }
        .miss-letters {
            display: flex;
            justify-content: center;
            gap: 10px;
            flex-wrap: wrap;
        }
        .miss-chip {
            background: #fff5f5;
            border: 2px solid #feb2b2;
            color: #c53030;
            padding: 6px 12px;
            border-radius: 12px;
            font-weight: bold;
            font-size: 1.1rem;
        }
        .perfect-msg {
            color: var(--success);
            font-weight: 800;
            font-size: 1.2rem;
            margin: 15px 0;
        }

        .btn-action-group {
            display: flex;
            justify-content: center;
            gap: 15px;
        }

        @keyframes popIn {
            0% { transform: scale(0.6); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }

        .collection-container {
            margin: 0 auto 15px auto;
        }

        /* スマートフォン向け最適化 */
        @media (max-width: 480px) {
            .char-slot { 
                width: calc((100vw - 60px) / 13);
                max-width: 26px; 
                height: 32px; 
                font-size: 11px; 
                border-width: 1.5px;
            }
            .collection-container { padding: 8px; border-radius: 15px; }
            .layout-switch-btn { padding: 4px 8px; font-size: 10px; }

            .container { padding: 15px 15px 25px 15px; }
            h1 { font-size: 1.8rem; }
            .subtitle { font-size: 0.95rem; margin-bottom: 20px; }
            .question-display { font-size: 6rem; }
            .btn-choice { padding: 14px; font-size: 1.3rem; border-radius: 16px; }
            .choices-grid { gap: 12px; }
            .donut-chart { width: 120px; height: 120px; }
            .donut-chart::before { width: 80px; height: 80px; }
            .donut-center-text { font-size: 22px; }
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- フィードバック演出用 -->
        <div id="feedback" class="feedback-overlay"></div>
        
        <!-- 1. スタート（設定）画面 -->
        <div id="scr-start" class="screen screen-active">
            <h1>アルファベットよみ</h1>
            <div class="subtitle">もじの 「よみかた」を 4つの なかから えらぼう！</div>
            
            <div class="settings-card" style="text-align: left; margin-bottom: 25px;">
                <div class="settings-row">
                    <span class="settings-label">🔊 おと と こえ</span>
                    <div class="toggle-group">
                        <button id="soundMasterBtn" class="toggle-item active" onclick="SoundController.toggle()">おと・こえ: ON</button>
                        <button id="soundMasterBtnOff" class="toggle-item" onclick="SoundController.toggle()">おと・こえ: OFF</button>
                    </div>
                </div>

                <div class="settings-row">
                    <span class="settings-label">🗣️ こえの しゅるい</span>
                    <div class="toggle-group">
                        <button id="mode-kana" class="toggle-item active" onclick="setVoiceMode('kana')">にほんご</button>
                        <button id="mode-native" class="toggle-item" onclick="setVoiceMode('native')">ネイティブ（えいご）</button>
                    </div>
                </div>

                <div class="settings-row">
                    <span class="settings-label">📝 もんだいの かず</span>
                    <div class="toggle-group">
                        <button id="q-5" class="toggle-item" onclick="setQuestionCount(5)">5もん</button>
                        <button id="q-10" class="toggle-item" onclick="setQuestionCount(10)">10もん</button>
                        <button id="q-all" class="toggle-item active" onclick="setQuestionCount(26)">ぜんぶ (26もん)</button>
                    </div>
                </div>
            </div>
            
            <button class="btn-pop btn-pop-success" style="font-size: 20px; padding: 14px 45px;" onclick="startGame()">はじめる</button>
        </div>

        <!-- 2. メインプレイ画面 -->
        <div id="scr-game" class="screen">
            <div class="game-header">
                <div id="q-counter">もんだい: 1 / 5</div>
                <div id="score-counter">いっぱつOK: 0</div>
            </div>

            <!-- こたえたアルファベット（PROGRESS MAP） -->
            <div class="collection-container" id="collectionContainer">
                <div class="collection-header">
                    <div style="font-size: 11px; color: #666; font-weight: bold; letter-spacing: 0.5px;">こたえたアルファベット</div>
                    <div>
                        <button id="layoutHideBtn" class="layout-switch-btn" onclick="switchMapLayout('hide')">かくす</button>
                        <button id="layoutAbcBtn" class="layout-switch-btn active" onclick="switchMapLayout('abc')">ABC</button>
                        <button id="layoutKbdBtn" class="layout-switch-btn" onclick="switchMapLayout('keyboard')">キーボード</button>
                        <button class="sound-toggle-btn layout-switch-btn" onclick="SoundController.toggle()">🔊 おと: ON</button>
                        <button class="layout-switch-btn" onclick="Navigation.showQuitModal(() => goHome())" style="background: #f1f5f9; color: var(--miss);">やめる</button>
                    </div>
                </div>
                <div class="collection-grid" id="collectionGrid"></div>
            </div>
            
            <!-- 出題文字とスピーカーボタン -->
            <div class="char-container">
                <div style="width: 60px;"></div> <!-- 左側の余白調整 -->
                <div id="question-char" class="question-display">A</div>
                <!-- スピーカーボタン：いつでも読み方を聴けるヒント -->
                <button class="btn-speaker" onclick="speakCurrentCharacter()" title="おとをきく">
                    <svg viewBox="0 0 24 24">
                        <path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/>
                    </svg>
                </button>
            </div>
            
            <p style="color: #7f8c8d; font-weight: bold; margin-bottom: 20px;">ただしい よみかたは どっちかな？</p>
            
            <!-- 4択ボタン -->
            <div class="choices-grid" id="choices-area">
                <!-- JSで動的生成 -->
            </div>
        </div>

        <!-- 3. リザルト画面 -->
        <div id="scr-result" class="screen">
            <h2 class="result-title">しんだん けっか</h2>
            
            <!-- ドーナツグラフ -->
            <div class="donut-chart" id="chart-graph">
                <div class="donut-center-text">
                    <span id="chart-per">100%</span>
                    <span style="font-size: 11px; color: #7f8c8d; display: block; margin-top: 2px;">できた率</span>
                </div>
            </div>
            
            <div class="legend">
                <div class="legend-item"><div class="color-box" style="background: var(--success);"></div>いっぱつで できた！</div>
                <div class="legend-item"><div class="color-box" style="background: #ffeaa7;"></div>あきらめずに できた！</div>
            </div>

            <!-- 苦手な文字のやさしい応援表示 -->
            <div class="review-box">
                <div id="review-content"></div>
            </div>

            <div class="btn-action-group">
                <button class="btn-pop btn-pop-success" style="padding: 12px 28px;" onclick="startGame()">もういちど あそぶ</button>
                <button class="btn-pop btn-pop-gray" style="padding: 12px 28px;" onclick="goHome()">はじめの がめん</button>
            </div>
        </div>
    </div>

    <script>
        // アルファベット日本語読みデータベース
        const alphabetReading = {
            'A': 'えー', 'B': 'びー', 'C': 'しー', 'D': 'でぃー', 'E': 'いー', 'F': 'えふ', 'G': 'じー',
            'H': 'えいち', 'I': 'あい', 'J': 'じぇー', 'K': 'けー', 'L': 'える', 'M': 'えむ', 'N': 'えぬ',
            'O': 'おー', 'P': 'ぴー', 'Q': 'きゅー', 'R': 'あーる', 'S': 'えす', 'T': 'てぃー', 'U': 'ゆー',
            'V': 'ぶぃー', 'W': 'だぶりゅー', 'X': 'えっくす', 'Y': 'わい', 'Z': 'ぜっと'
        };

        const charData = {
            'A': { read: 'えー', finger: 'pinky-l', fill: 'fill-a' },
            'B': { read: 'びー', finger: 'index-l' },
            'C': { read: 'しー', finger: 'middle-l' },
            'D': { read: 'でー', finger: 'middle-l' },
            'E': { read: 'いー', finger: 'middle-l', fill: 'fill-e' },
            'F': { read: 'えふ', finger: 'index-l' },
            'G': { read: 'じー', finger: 'index-l' },
            'H': { read: 'えいち', finger: 'index-r' },
            'I': { read: 'あい', finger: 'middle-r', fill: 'fill-i' },
            'J': { read: 'じぇー', finger: 'index-r' },
            'K': { read: 'けー', finger: 'middle-r' },
            'L': { read: 'える', finger: 'ring-r' },
            'M': { read: 'えむ', finger: 'index-r' },
            'N': { read: 'えぬ', finger: 'index-r' },
            'O': { read: 'おー', finger: 'ring-r', fill: 'fill-o' },
            'P': { read: 'ぴー', finger: 'pinky-r' },
            'Q': { read: 'きゅー', finger: 'pinky-l' },
            'R': { read: 'あーる', finger: 'index-l' },
            'S': { read: 'えす', finger: 'ring-l' },
            'T': { read: 'てぃー', finger: 'index-l' },
            'U': { read: 'ゆー', finger: 'index-r', fill: 'fill-u' },
            'V': { read: 'ぶい', finger: 'index-l' },
            'W': { read: 'だぶりゅー', finger: 'ring-l' },
            'X': { read: 'えっくす', finger: 'ring-l' },
            'Y': { read: 'わい', finger: 'index-r' },
            'Z': { read: 'ぜっと', finger: 'pinky-l' }
        };

        const kbdRows = [
            ["Q","W","E","R","T","Y","U","I","O","P"],
            ["A","S","D","F","G","H","J","K","L"],
            ["Z","X","C","V","B","N","M"]
        ];

        const alphaKeys = Object.keys(charData);
        let cleared = new Set();
        let sessionCleared = new Set();
        let currentLayout = 'abc';

        let voiceMode = SettingsManager.get('voiceMode') === 'en' ? 'native' : 'kana';
        let gState = {
            maxQuestions: 5,
            currentIdx: 0,
            questionList: [],
            firstTryCorrectCount: 0,
            isFirstTry: true,
            retryLetters: new Set(),
            currentAnswer: "",
            isTransitioning: false // 次の問題への自動遷移中の二重入力防止
        };

        function switchMapLayout(layout) {
            currentLayout = layout;
            const container = document.getElementById('collectionContainer');
            
            document.getElementById('layoutHideBtn').classList.toggle('active', layout === 'hide');
            document.getElementById('layoutAbcBtn').classList.toggle('active', layout === 'abc');
            document.getElementById('layoutKbdBtn').classList.toggle('active', layout === 'keyboard');
            
            if (layout === 'hide') {
                container.classList.add('map-hidden');
            } else {
                container.classList.remove('map-hidden');
                renderCollectionMap();
            }
        }

        function createSlot(c) {
            const s = document.createElement('div');
            const data = charData[c] || { finger: 'index-l' };
            const isActive = cleared.has(c) || sessionCleared.has(c);
            s.className = `char-slot f-${data.finger} ${isActive ? 'active' : ''} ${data.fill || ''}`;
            s.textContent = c;
            return s;
        }

        function renderCollectionMap() {
            if (currentLayout === 'hide') return;
            const grid = document.getElementById('collectionGrid');
            if (!grid) return;
            grid.innerHTML = "";
            
            if (currentLayout === 'abc') {
                const row = document.createElement('div'); row.className = 'kbd-row';
                alphaKeys.forEach(c => {
                    row.appendChild(createSlot(c));
                    if(c === 'M') { grid.appendChild(row.cloneNode(true)); row.innerHTML = ""; }
                });
                grid.appendChild(row);
            } else {
                kbdRows.forEach(rowArr => {
                    const rowDiv = document.createElement('div'); rowDiv.className = 'kbd-row';
                    rowArr.forEach(c => { rowDiv.appendChild(createSlot(c)); });
                    grid.appendChild(rowDiv);
                });
            }
        }

        // DOM読み込み完了時の初期化
        window.addEventListener('DOMContentLoaded', () => {
            const savedVoiceMode = SettingsManager.get('voiceMode') === 'en' ? 'native' : 'kana';
            setVoiceMode(savedVoiceMode);
            
            gState.maxQuestions = SettingsManager.get('maxQuestions_read') || 5;
            updateQCountUI();
            renderCollectionMap();
        });

        // こえのしゅるいを選択
        function setVoiceMode(mode) {
            voiceMode = mode;
            document.getElementById('mode-native').classList.toggle('active', mode === 'native');
            document.getElementById('mode-kana').classList.toggle('active', mode === 'kana');
            
            SettingsManager.set('voiceMode', mode === 'native' ? 'en' : 'ja');
            SpeechManager.unlock();
            SpeechManager.speak(mode === 'native' ? "Ready" : "スタート");
        }

        // もんだいの数を選択
        function setQuestionCount(count) {
            gState.maxQuestions = count;
            SettingsManager.set('maxQuestions_read', count);
            updateQCountUI();
            SpeechManager.unlock();
            AudioManager.playTone(440, 'sine', 0.05, 0.05);
        }

        function updateQCountUI() {
            document.getElementById('q-5').classList.toggle('active', gState.maxQuestions === 5);
            document.getElementById('q-10').classList.toggle('active', gState.maxQuestions === 10);
            document.getElementById('q-all').classList.toggle('active', gState.maxQuestions === 26);
        }

        // 最初の画面に戻る
        function goHome() {
            SpeechManager.cancel();
            showScreen('scr-start');
        }

        function showScreen(screenId) {
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('screen-active'));
            document.getElementById(screenId).classList.add('screen-active');
        }

        // ゲーム開始
        function startGame() {
            SpeechManager.unlock();
            gState.currentIdx = 0;
            gState.firstTryCorrectCount = 0;
            gState.retryLetters.clear();
            gState.isTransitioning = false;
            sessionCleared.clear();
            
            // アルファベット配列をシャッフルして問題リストを作成
            const keys = Object.keys(alphabetReading);
            gState.questionList = keys.sort(() => Math.random() - 0.5).slice(0, gState.maxQuestions);
            
            showScreen('scr-game');
            renderCollectionMap();
            loadQuestion();
        }

        // 問題の読み込み
        function loadQuestion() {
            gState.isFirstTry = true;
            gState.isTransitioning = false;
            
            const currentChar = gState.questionList[gState.currentIdx];
            gState.currentAnswer = alphabetReading[currentChar];
            
            // ステータス表示
            document.getElementById('q-counter').innerText = `もんだい: ${gState.currentIdx + 1} / ${gState.maxQuestions}`;
            document.getElementById('score-counter').innerText = `いっぱつOK: ${gState.firstTryCorrectCount}`;
            document.getElementById('question-char').innerText = currentChar;
            
            // 4択ボタンの作成（正解1つ + 誤答3つ）
            let choices = [gState.currentAnswer];
            const allReadings = Object.values(alphabetReading);
            while (choices.length < 4) {
                let randomReading = allReadings[Math.floor(Math.random() * allReadings.length)];
                if (!choices.includes(randomReading)) {
                    choices.push(randomReading);
                }
            }
            // 選択肢のシャッフル
            choices.sort(() => Math.random() - 0.5);
            
            // DOMへの適用
            const choicesArea = document.getElementById('choices-area');
            choicesArea.innerHTML = "";
            choices.forEach(choice => {
                const btn = document.createElement('button');
                btn.className = "btn-choice";
                btn.innerText = choice;
                btn.onclick = () => checkChoice(choice, btn);
                choicesArea.appendChild(btn);
            });

        }

        // 現在の問題のアルファベット音声を発音（スピーカーボタンクリック用）
        function speakCurrentCharacter() {
            const currentChar = gState.questionList[gState.currentIdx];
            speakCharacter(currentChar);
        }

        // 音声合成による読み上げ（こえのしゅるいに応じて発音）
        function speakCharacter(char) {
            SpeechManager.unlock();
            if (voiceMode === 'native') {
                SpeechManager.speak(char, 'en');
            } else {
                SpeechManager.speak(alphabetReading[char], 'ja');
            }
        }

        // 回答選択肢のチェック
        function checkChoice(selected, clickedBtn) {
            if (gState.isTransitioning) return; // 自動遷移中の二重入力を防止
            if (document.getElementById('quit-modal-common')) return; // やめるモーダル表示中は操作無効

            if (selected === gState.currentAnswer) {
                gState.isTransitioning = true; // 遷移開始フラグ

                const currentChar = gState.questionList[gState.currentIdx];
                cleared.add(currentChar);
                sessionCleared.add(currentChar);
                renderCollectionMap();

                // 正解の挙動
                if (gState.isFirstTry) {
                    gState.firstTryCorrectCount++;
                    showFeedback("✨ せいかい！ ✨", "var(--success)");
                    AudioManager.play('ok');
                } else {
                    showFeedback("あきらめずに できた！ 🌟", "#ff9f43");
                    // できた！というピピッと上がる音
                    AudioManager.playTone(523, 'sine', 0.1, 0.08);
                    setTimeout(() => AudioManager.playTone(659, 'sine', 0.2, 0.08), 80);
                }
                
                // ボタンの操作をすべてロック
                document.querySelectorAll('.btn-choice').forEach(b => b.disabled = true);
                clickedBtn.classList.add('correct');
                
                // 1.2秒後に自動的に次の問題、または結果へ移行
                setTimeout(() => {
                    nextQuestion();
                }, 1200);

            } else {
                // 不正解・選び直しの挙動
                showFeedback("おしい！ えらびなおそう ✊", "#ff9f43");
                AudioManager.play('ng');
                
                gState.isFirstTry = false;
                gState.retryLetters.add(gState.questionList[gState.currentIdx]); // 苦手リストに追加
                
                clickedBtn.disabled = true;
                clickedBtn.classList.add('wrong');
            }
        }

        function showFeedback(text, color) {
            const fb = document.getElementById('feedback');
            fb.innerText = text;
            fb.style.color = color;
            fb.style.animation = 'none';
            fb.offsetHeight; // リフロー
            fb.style.animation = 'floatUp 1.2s ease forwards';
        }

        // 次の問題、あるいはリザルトへ進む処理
        function nextQuestion() {
            // もしやめるモーダルが表示中なら、モーダルが閉じるまで待つ
            if (document.getElementById('quit-modal-common')) {
                setTimeout(nextQuestion, 200);
                return;
            }
            gState.currentIdx++;
            if (gState.currentIdx < gState.maxQuestions) {
                loadQuestion();
            } else {
                showResult();
            }
        }

        // 診断結果画面の描画
        function showResult() {
            showScreen('scr-result');
            
            const total = gState.maxQuestions;
            const accuracy = Math.round((gState.firstTryCorrectCount / total) * 100);
            
            // パーセント数値の適用
            document.getElementById('chart-per').innerText = `${accuracy}%`;
            
            // CSSコニックグラデーションによるドーナツグラフ描画
            const chart = document.getElementById('chart-graph');
            chart.style.background = `conic-gradient(var(--success) 0% ${accuracy}%, #ffeaa7 ${accuracy}% 100%)`;
            
            // 苦手文字（選び直しが発生した文字）のチップ表示
            const reviewContent = document.getElementById('review-content');
            if (gState.retryLetters.size === 0) {
                reviewContent.innerHTML = `<div class="perfect-msg">👑 ぜんぶ いっぱつで できたよ！すごすぎる！ 👑</div>`;
                // パーフェクトファンファーレ効果音
                AudioManager.play('perfect');
                
                // 紙吹雪演出
                createConfetti();
            } else {
                let html = `<div class="review-title">つぎは これを れんしゅう してみよう！</div>`;
                html += `<div class="miss-letters">`;
                gState.retryLetters.forEach(let => {
                    html += `<div class="miss-chip">${let} (${alphabetReading[let]})</div>`;
                });
                html += `</div>`;
                reviewContent.innerHTML = html;
                
                AudioManager.play('clear');
            }
        }

        // 紙吹雪アニメーション
        function createConfetti() {
            for(let i=0; i<60; i++) {
                const c = document.createElement('div');
                c.style.cssText = `position:fixed; width:8px; height:8px; background:hsl(${Math.random()*360},80%,65%); top:-10px; left:${Math.random()*100}vw; z-index:1100; pointer-events:none; border-radius:50%;`;
                document.body.appendChild(c);
                c.animate([
                    { transform: 'translateY(0) rotate(0)' },
                    { transform: `translateY(105vh) rotate(${Math.random()*360}deg)` }
                ], { 
                    duration: 1500 + Math.random()*2000, 
                    easing: 'ease-out' 
                }).onfinish = () => c.remove();
            }
        }
    </script>
</body>
</html>
